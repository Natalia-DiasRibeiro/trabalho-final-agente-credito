<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistente de Risco de Crédito</title>
<style>
  :root { --verde: #064e3b; --fundo: #f3f4f6; --usuario: #d1fae5; --agente: #ffffff; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, Arial, sans-serif; background: var(--fundo); color: #111; display: flex; flex-direction: column; height: 100vh; }
  header { background: var(--verde); color: #fff; padding: 12px 16px; }
  header h1 { margin: 0; font-size: 1.1rem; }
  header p { margin: 2px 0 0; font-size: .85rem; opacity: .85; }
  #mensagens { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.45; }
  .user { align-self: flex-end; background: var(--usuario); }
  .model { align-self: flex-start; background: var(--agente); border: 1px solid #e5e7eb; }
  .erro { align-self: center; color: #b91c1c; font-size: .9rem; }
  .ferramentas { font-size: .75rem; color: #555; margin-top: 6px; }
  form { display: flex; gap: 8px; padding: 12px; background: #fff; border-top: 1px solid #e5e7eb; }
  input { flex: 1; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
  button { background: var(--verde); color: #fff; border: 0; border-radius: 8px; padding: 0 18px; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  #exemplos { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 12px; background: #fff; }
  #exemplos button { background: #ecfdf5; color: #064e3b; border: 1px solid #a7f3d0; padding: 5px 10px; font-size: .8rem; border-radius: 14px; }
  #espera { text-align: center; font-size: .8rem; color: #92400e; background: #fffbeb; padding: 4px; display: none; }
</style>
</head>
<body>
<header>
  <h1>Assistente de Risco de Crédito</h1>
  <p>Pergunte sobre os dados de clientes de cartão (Taiwan, 2005) ou peça a estimativa de risco de inadimplência de um cliente.</p>
</header>
<main id="mensagens" aria-live="polite"></main>
<div id="espera">Acordando o servidor... a primeira resposta pode levar cerca de 1 minuto.</div>
<div id="exemplos" aria-label="Exemplos de perguntas"></div>
<div style="text-align:center;padding:4px;background:#fff"><button id="nova" type="button" style="background:#e5e7eb;color:#111;padding:6px 14px">🧹 Nova conversa</button></div>
<form id="form">
  <input id="entrada" autocomplete="off" maxlength="1000" placeholder="Ex.: Qual a proporção de inadimplentes por escolaridade?" required>
  <button id="enviar">Enviar</button>
</form>
<script>
  const historico = [];                       // [{papel: "user"|"model", texto}]
  const caixa = document.getElementById("mensagens");
  const form = document.getElementById("form");
  const entrada = document.getElementById("entrada");
  const botao = document.getElementById("enviar");

  function mostrar(texto, classe, etapas) {
    const div = document.createElement("div");
    div.className = "msg " + classe;
    div.textContent = texto;                  // textContent evita injeção de HTML (XSS)
    if (etapas && etapas.length) {               // mostra o que o agente fez: RAG, modelo, verificação...
      const f = document.createElement("div");
      f.className = "ferramentas";
      f.textContent = "🔧 " + etapas.join(" · ");
      div.appendChild(f);
    }
    caixa.appendChild(div);
    caixa.scrollTop = caixa.scrollHeight;
  }

  const BOAS_VINDAS = "Olá! Posso responder perguntas sobre o dataset de clientes de cartão de crédito ou estimar a probabilidade de inadimplência de um cliente com o modelo do nosso grupo. É uma estimativa estatística, não uma decisão de crédito.";
  const EXEMPLOS = [
    "Qual a proporção de inadimplentes por escolaridade?",
    "Qual a taxa de inadimplência de quem atrasou 2 ou mais meses em setembro?",
    "Qual o risco de um cliente de 35 anos, pós-graduação, limite 50000, atraso de 2 meses em setembro, 1 em agosto, pagou tudo em julho, fatura de setembro 30000 e pagou 0?",
    "Esse modelo é confiável?"];
  const lista = document.getElementById("exemplos");
  EXEMPLOS.forEach(t => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = t.length > 62 ? t.slice(0, 60) + "…" : t; b.title = t;
    b.addEventListener("click", () => { entrada.value = t; form.requestSubmit(); });
    lista.appendChild(b);
  });
  mostrar(BOAS_VINDAS, "model");
  document.getElementById("nova").addEventListener("click", () => {   // esquece a conversa anterior
    historico.length = 0;
    caixa.innerHTML = "";
    mostrar(BOAS_VINDAS, "model");
  });

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const texto = entrada.value.trim();
    if (!texto) return;
    mostrar(texto, "user");
    entrada.value = "";
    botao.disabled = true;
    const espera = document.getElementById("espera");
    const avisoEspera = setTimeout(() => { espera.style.display = "block"; }, 6000);   // servidor dormindo no plano gratuito
    try {
      const limite = new AbortController();
      const relogio = setTimeout(() => limite.abort(), 55000);      // desiste depois de 55 s
      const r = await fetch("/api/chat", {
        signal: limite.signal,
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mensagem: texto, historico })
      });
      clearTimeout(relogio);
      const dados = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(dados.erro || "Erro no servidor");
      mostrar(dados.resposta, "model", dados.etapas);
      historico.push({ papel: "user", texto }, { papel: "model", texto: dados.resposta });
    } catch (e) {
      mostrar("⚠️ " + (e.name === "AbortError" ? "O servidor demorou demais. Se o app estava dormindo, tente de novo." : e.message), "erro");
    } finally {
      clearTimeout(avisoEspera); espera.style.display = "none";
      botao.disabled = false;
      entrada.focus();
    }
  });
</script>
</body>
</html>
